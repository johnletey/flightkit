name: Sync OpenAPI Specs

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: airnavradar
            spec_url: https://www.airnavradar.com/api/openapi
            spec_file: openapi.json
          - provider: flightaware
            spec_url: https://static.flightaware.com/rsrc/aeroapi/aeroapi-openapi.yml
            spec_file: openapi.yaml
          - provider: fr24
            spec_url: https://fr24api.flightradar24.com/documentation/Flightradar24-API.yaml
            spec_file: openapi.yaml
          - provider: opensky
            spec_url: >-
              https://raw.githubusercontent.com/api-evangelist/opensky/main/openapi/opensky-flights-api-openapi.yml
              https://raw.githubusercontent.com/api-evangelist/opensky/main/openapi/opensky-state-vectors-api-openapi.yml
              https://raw.githubusercontent.com/api-evangelist/opensky/main/openapi/opensky-tracks-api-openapi.yml
            spec_file: openapi.yaml
          - provider: planefinder
            spec_url: https://api.planefinder.net/docs/api.json
            spec_file: openapi.json
    defaults:
      run:
        working-directory: ${{ matrix.provider }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.provider }}/go.mod
          cache-dependency-path: ${{ matrix.provider }}/go.sum

      - name: Fetch Upstream Spec
        run: |
          urls=(${{ matrix.spec_url }})
          if [ "${#urls[@]}" -eq 1 ]; then
            curl -sSf "${urls[0]}" -o "${{ matrix.spec_file }}"
          else
            files=()
            for url in "${urls[@]}"; do
              file="$(basename "$url")"
              curl -sSf "$url" -o "$file"
              files+=("$file")
            done
            npx -y @redocly/cli join "${files[@]}" -o "${{ matrix.spec_file }}"
          fi

      - name: Regenerate Client
        run: go generate ./...

      - name: Open Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(${{ matrix.provider }}): sync OpenAPI spec"
          branch: sync-openapi-spec/${{ matrix.provider }}
          delete-branch: true
          title: "chore(${{ matrix.provider }}): sync OpenAPI spec"
          body: |
            Pulls the latest ${{ matrix.provider }} OpenAPI spec and regenerates the Go client.

            Opened automatically by the weekly `Sync OpenAPI Specs` workflow.
