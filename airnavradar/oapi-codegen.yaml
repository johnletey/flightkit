# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.7.1/configuration-schema.json
package: airnavradar
generate:
  client: true
  models: true
output: openapi.gen.go
output-options:
  # The spec already has schemas whose names collide with the
  # <OperationID>Response wrapper structs that oapi-codegen generates for each
  # operation. A different suffix keeps the two apart.
  response-type-suffix: HTTPResponse
